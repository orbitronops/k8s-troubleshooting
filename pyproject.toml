[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitronops-k8s-troubleshooting"
version = "0.1.0"
description = "Read-only Kubernetes troubleshooting agent for platform teams — OrbitronOps demo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OrbitronOps", email = "hello@orbitronops.com" }]
keywords = ["kubernetes", "sre", "troubleshooting", "ai-agent", "on-call"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbitronops-k8s-troubleshoot = "orbitronops_k8s_troubleshoot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
